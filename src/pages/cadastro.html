<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Criar Conta | Primeiros Passos</title>
    <meta
      name="description"
      content="Crie sua conta no Primeiros Passos e dê o primeiro passo para um futuro cheio de oportunidades."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="../styles/global.css" />
  </head>

  <body>
    <div class="auth-page">
      <!-- HEADER — Apenas logo -->
      <header class="auth-header">
        <a href="../../index.html" class="auth-logo" aria-label="Voltar para a página inicial">
          <img src="../assets/logos/logo.png" alt="Primeiros Passos" />
        </a>
      </header>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="auth-container">
        <div class="auth-wrapper auth-wrapper--reversed">
          <!-- ═══ LADO DIREITO — FORMULÁRIO ═══ -->
          <section class="auth-form-side" aria-labelledby="auth-title">
            <h1 id="auth-title">Criar <span>conta</span></h1>
            <p class="auth-subtitle">Dê o primeiro passo para um futuro cheio de oportunidades!</p>

            <!-- Tipo de conta -->
            <fieldset class="auth-type-selector" aria-label="Tipo de conta">
              <legend class="sr-only">Tipo de conta</legend>

              <div class="auth-type-option">
                <input
                  type="radio"
                  name="account-type"
                  id="type-candidato"
                  value="candidato"
                  checked
                />
                <label class="auth-type-label" for="type-candidato">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  Candidato
                </label>
              </div>

              <div class="auth-type-option">
                <input type="radio" name="account-type" id="type-empresa" value="empresa" />
                <label class="auth-type-label" for="type-empresa">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2" y="7" width="20" height="14" rx="2" />
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
                    <line x1="12" y1="12" x2="12" y2="16" />
                    <line x1="10" y1="14" x2="14" y2="14" />
                  </svg>
                  Empresa
                </label>
              </div>
            </fieldset>

            <form class="auth-form" id="register-form" novalidate>
              <!-- Nome completo -->
              <div class="auth-field">
                <label for="register-name">Nome completo</label>
                <div class="auth-input-wrapper">
                  <span class="auth-input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                      <circle cx="12" cy="7" r="4" />
                    </svg>
                  </span>
                  <input
                    class="auth-input"
                    type="text"
                    id="register-name"
                    name="name"
                    placeholder="Seu nome completo"
                    autocomplete="name"
                    aria-describedby="register-name-error"
                    required
                  />
                </div>
                <span
                  class="auth-error-msg"
                  id="register-name-error"
                  role="alert"
                  aria-live="polite"
                ></span>
              </div>

              <!-- E-mail -->
              <div class="auth-field">
                <label for="register-email">E-mail</label>
                <div class="auth-input-wrapper">
                  <span class="auth-input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <rect x="2" y="4" width="20" height="16" rx="3" />
                      <path d="M2 7l10 7 10-7" />
                    </svg>
                  </span>
                  <input
                    class="auth-input"
                    type="email"
                    id="register-email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    aria-describedby="register-email-error"
                    required
                  />
                </div>
                <span
                  class="auth-error-msg"
                  id="register-email-error"
                  role="alert"
                  aria-live="polite"
                ></span>
              </div>

              <!-- Senha -->
              <div class="auth-field">
                <label for="register-password">Senha</label>
                <div class="auth-input-wrapper">
                  <span class="auth-input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <rect x="3" y="11" width="18" height="11" rx="3" />
                      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                  </span>
                  <input
                    class="auth-input"
                    type="password"
                    id="register-password"
                    name="password"
                    placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password"
                    aria-describedby="register-password-error password-strength-label"
                    required
                  />
                  <button type="button" class="auth-toggle-password" aria-label="Mostrar senha">
                    <svg viewBox="0 0 24 24">
                      <path
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                      />
                      <path
                        d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                      />
                      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  </button>
                </div>
                <!-- Indicador de força da senha -->
                <div class="auth-password-strength" id="password-strength" aria-live="polite">
                  <div class="auth-strength-bars" aria-hidden="true">
                    <div class="auth-strength-bar" id="strength-bar-1"></div>
                    <div class="auth-strength-bar" id="strength-bar-2"></div>
                    <div class="auth-strength-bar" id="strength-bar-3"></div>
                    <div class="auth-strength-bar" id="strength-bar-4"></div>
                  </div>
                  <span class="auth-strength-label" id="password-strength-label"></span>
                </div>
                <span
                  class="auth-error-msg"
                  id="register-password-error"
                  role="alert"
                  aria-live="polite"
                ></span>
              </div>

              <!-- Confirmar Senha -->
              <div class="auth-field">
                <label for="register-password-confirm">Confirmar senha</label>
                <div class="auth-input-wrapper">
                  <span class="auth-input-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                  </span>
                  <input
                    class="auth-input"
                    type="password"
                    id="register-password-confirm"
                    name="password_confirm"
                    placeholder="Repita sua senha"
                    autocomplete="new-password"
                    aria-describedby="register-confirm-error"
                    required
                  />
                  <button
                    type="button"
                    class="auth-toggle-password"
                    aria-label="Mostrar confirmação de senha"
                  >
                    <svg viewBox="0 0 24 24">
                      <path
                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                      />
                      <path
                        d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                      />
                      <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  </button>
                </div>
                <span
                  class="auth-error-msg"
                  id="register-confirm-error"
                  role="alert"
                  aria-live="polite"
                ></span>
              </div>

              <!-- Termos de uso -->
              <div class="auth-field">
                <label class="auth-remember" style="align-items: flex-start; gap: 10px">
                  <input
                    type="checkbox"
                    name="terms"
                    id="register-terms"
                    required
                    style="margin-top: 2px"
                  />
                  <span style="font-size: 0.8rem; line-height: 1.5">
                    Ao criar uma conta, você concorda com os
                    <a href="#" style="color: #a855f7; font-weight: 600">Termos de Uso</a>
                    e a
                    <a href="#" style="color: #a855f7; font-weight: 600">Política de Privacidade</a>
                  </span>
                </label>
                <span
                  class="auth-error-msg"
                  id="register-terms-error"
                  role="alert"
                  aria-live="polite"
                ></span>
              </div>

              <!-- Botão Cadastrar -->
              <button type="submit" class="auth-submit" id="btn-register">
                Criar conta <span class="arrow" aria-hidden="true">→</span>
              </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider" role="separator">
              <span>ou continue com</span>
            </div>

            <!-- Social Login -->
            <div class="auth-social-buttons">
              <a
                href="#"
                class="auth-social-btn"
                id="btn-google-register"
                aria-label="Cadastrar com Google"
              >
                <img
                  src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                  alt=""
                  aria-hidden="true"
                  width="20"
                  height="20"
                />
                Google
              </a>
              <a
                href="#"
                class="auth-social-btn"
                id="btn-linkedin-register"
                aria-label="Cadastrar com LinkedIn"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#0A66C2" aria-hidden="true">
                  <path
                    d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
                  />
                </svg>
                LinkedIn
              </a>
            </div>

            <!-- Link para login -->
            <p class="auth-switch">Já tem uma conta? <a href="login.html">Fazer login</a></p>
          </section>

          <!-- ═══ LADO ESQUERDO — ILUSTRAÇÃO ═══ -->
          <aside class="auth-illustration-side" aria-hidden="true">
            <div class="auth-illustration-bg"></div>

            <div class="auth-star auth-star--1">
              <img src="../assets/images/accounts/star.png" alt="" />
            </div>
            <div class="auth-star auth-star--2">
              <img src="../assets/images/accounts/star.png" alt="" />
            </div>
            <div class="auth-star auth-star--3">
              <img src="../assets/images/accounts/star.png" alt="" />
            </div>
            <div class="auth-star auth-star--4">
              <img src="../assets/images/accounts/star.png" alt="" />
            </div>
            <div class="auth-star auth-star--5">
              <img src="../assets/images/accounts/star.png" alt="" />
            </div>
            <div class="auth-star auth-star--6">
              <img src="../assets/images/accounts/star.png" alt="" />
            </div>

            <div class="auth-illustration-content">
              <h2>Novo por aqui?</h2>
              <p>
                Junte-se a nós e descubra novas oportunidades, conheça empresas incríveis e dê o
                primeiro passo para o <em>seu futuro!</em>
              </p>
              <img
                class="auth-illustration-image"
                src="../assets/images/accounts/createAccount.png"
                alt="Jovem com notebook e foguete ao fundo"
              />
            </div>
          </aside>
        </div>
      </main>
    </div>

    <script type="module" src="../js/pages/accounts.js"></script>
    <script src="../js/vlibras.js"></script>
  </body>
</html>
